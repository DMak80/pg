# Шард2, write-эндпоинт: зеркально haproxy.cfg (шард1).
# Подписки на шард2 (обратные после flip'а, P2) и ops-запросы идут через hap2.
defaults
    mode tcp
    timeout connect 5s
    timeout client 60m
    timeout server 60m

frontend ft_write
    bind *:5432
    default_backend bk_master

backend bk_master
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 init-addr libc,none
    server s2a s2a:5432 check port 8008
    server s2b s2b:5432 check port 8008
