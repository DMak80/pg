# Шард2, write-эндпоинт: зеркально haproxy.cfg (шард1).
# Подписки на шард2 (обратные после flip'а, P2) и ops-запросы идут через hap2.
# Адреса бэкендов в рантайме обновляет hasync из etcd (set server ... addr).
global
    stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
    mode tcp
    timeout connect 5s
    timeout client 60m
    timeout server 60m

frontend ft_write
    bind *:5432
    default_backend bk_master

backend bk_master
    mode tcp
    option httpchk GET /primary
    http-check expect status 200
    # 127.0.0.1 — заглушка для семейства адресов: реальный addr приходит
    # из etcd через hasync (set server ... addr); до применения сервер DOWN
    default-server inter 1s fall 2 rise 1 init-addr none
    server s2a 127.0.0.1:5432 check port 8008
    server s2b 127.0.0.1:5432 check port 8008
