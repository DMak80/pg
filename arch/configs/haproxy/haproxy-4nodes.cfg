# configs/haproxy/haproxy-4nodes.cfg
#
# HAProxy для 4-нодовой схемы (см. 10-four-nodes.md).
# Отличие от базового haproxy.cfg — только строки `server pg4 ...` в обоих backend'ах.
#
# Маршрутизация:
#   :5432 → bk_pg_master  (http-check GET /primary, 200 только у лидера) → WRITE
#   :5433 → bk_pg_read    (http-check GET /read-only, 200 у лидера+реплик) → READ (4 ноды)
#   :7000 → stats UI
#
# Валидация: docker run --rm -v $(pwd)/haproxy-4nodes.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
#                     haproxy:2.8-alpine haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg

global
    log stdout format raw local0
    maxconn 4096
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

resolvers default-dns
    nameserver dns1 127.0.0.1:53
    nameserver dns2 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      30s
    hold refused    30s
    hold nx         30s
    hold timeout    30s
    hold valid      10s
    hold obsolete   30s

defaults
    log     global
    mode    tcp
    option  tcplog
    timeout connect 5s
    timeout client  1m
    timeout server  1m
    retries 2
    default-server init-addr libc,none resolvers default-dns resolve-prefer ipv4 inter 3s

# ────────────────────────────────────────────────────────────────────────────
# WRITE: порт 5432 → текущий лидер (ровно один)
# ────────────────────────────────────────────────────────────────────────────
frontend ft_pg_write
    bind *:5432
    default_backend bk_pg_master

backend bk_pg_master
    balance first                # на активный сервер (т.к. активен 1 — лидер)
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg1 pg1:8008 check port 8008
    server pg2 pg2:8008 check port 8008
    server pg3 pg3:8008 check port 8008
    server pg4 pg4:8008 check port 8008

# ────────────────────────────────────────────────────────────────────────────
# READ: порт 5433 → лидер + реплики (4 ноды — больше ресурсов для чтения)
#   Если хочешь ТОЛЬКО реплики — поменяй путь на /replica
# ────────────────────────────────────────────────────────────────────────────
frontend ft_pg_read
    bind *:5433
    default_backend bk_pg_read

backend bk_pg_read
    balance leastconn
    option httpchk GET /read-only
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg1 pg1:8008 check port 8008
    server pg2 pg2:8008 check port 8008
    server pg3 pg3:8008 check port 8008
    server pg4 pg4:8008 check port 8008

# ────────────────────────────────────────────────────────────────────────────
# Stats UI: http://<pg-lb>:7000/
# ────────────────────────────────────────────────────────────────────────────
listen stats
    bind *:7000
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
