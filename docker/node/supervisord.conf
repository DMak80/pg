; Супервизор узла pgworker-node (Д4): Spilo/Patroni — главный процесс,
; pg_doorman (P13–P17) — рядом. HAProxy в образе НЕ поднимается: его
; write-фронтенд :5432 конфликтует с PostgreSQL в одном netns (Д4 — один
; контейнер на ноду); write-вход MVP — прямой pg-порт master-ноды.
; Обёртки делают программы условными: без бинарника/конфига сервис не стартует
; (startsecs=0: быстрый exit 0 обёртки — не «неудачный старт»).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
; restore-операция WalReceiver (под postgres) останавливает/возвращает
; Patroni ноды (arch/19 §3.5) — сокет доступен группе postgres.
chmod=0770
chown=root:postgres

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:spilo]
; Штатный запуск Spilo (configure_spilo + Patroni + runit-сервисы внутри).
; Обёртка (arch/14 §2.1): launch.sh ставит `runsvdir -P` — runsv в своих
; группах, групповой stop supervisord'а их не достаёт; обёртка гасит
; runit-дерево сама, иначе сироты держат supervise/lock и Patroni
; следующего `start spilo` не стартует никогда.
command=/spilo-supervised.sh
priority=10
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pg_doorman]
; Пулер :6432 (P13/P14/P15/P17); при сборке без DOORMAN_URL — обёртка молча
; завершается (R1: узел без doorman, EnableDoorman=false у PgWorker).
command=/bin/sh /docker-entrypoint-doorman.sh
priority=30
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:walreceiver]
; Приёмник WAL бэкапов (t25, arch/19 §3): self-contained бинарь /opt/pgw-wal
; (сборка образа — двухшаговая: publish на хосте, см. docker/node/Dockerfile).
; Условность запуска обеспечивает сам бинарь: отсутствие PGW_BACKUP_* —
; старт-отказ с ненулевым exit (окно диагностики в /dev/stdout), supervisord
; его НЕ перезапускает (autorestart=unexpected + exitcodes=0 + startretries=0:
; рестарты ТОЛЬКО падений проработавшего процесса; старт-отказ до startsecs —
; FATAL без ретраев, «не лупит» — spec §3.2). user=postgres — доступ к pg_wal
; PGDATA (fallback .history, §3).
command=/opt/pgw-wal/walreceiver
priority=40
user=postgres
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
