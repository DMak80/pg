; Супервизор узла pgworker-node (Д4): Spilo/Patroni — главный процесс,
; haproxy (P2 write-вход) и pg_doorman (P13–P17) — рядом. Обёртки-скрипты
; делают программы условными: без конфига/бинарника сервис молча не стартует
; (startsecs=0: быстрый exit 0 обёртки — не «неудачный старт»).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:spilo]
; Штатный запуск Spilo (configure_spilo + Patroni + runit-сервисы внутри).
command=/bin/sh /launch.sh
priority=10
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:haproxy]
; Write-фронтенд :5432 → primary шарда (httpchk GET /primary, P2).
; exit 0 = «конфига нет — не нужен» (не перезапускать); падение — рестарт.
command=/bin/sh /docker-entrypoint-haproxy.sh
priority=20
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pg_doorman]
; Пулер :6432 (P13/P14/P15/P17); при сборке без DOORMAN_URL — обёртка молча
; завершается (R1: узел без doorman, EnableDoorman=false у PgWorker).
command=/bin/sh /docker-entrypoint-doorman.sh
priority=30
autorestart=unexpected
exitcodes=0
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
