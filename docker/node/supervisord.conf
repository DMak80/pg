; Супервизор узла pgworker-node (Д4): Spilo/Patroni — главный процесс,
; pg_doorman (P13–P17) — рядом. HAProxy в образе НЕ поднимается: его
; write-фронтенд :5432 конфликтует с PostgreSQL в одном netns (Д4 — один
; контейнер на ноду); write-вход MVP — прямой pg-порт master-ноды.
; Условных программ нет: отказ старта (нет бинарника/конфига) — ненулевым
; exit главного entrypoint ДО supervisord (контейнер гаснет).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
; restore-операция агента PgNode (под postgres) останавливает/возвращает
; Patroni ноды (arch/backups/03-restore.md) — сокет доступен группе postgres.
chmod=0770
chown=root:postgres

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:spilo]
; Штатный запуск Spilo (configure_spilo + Patroni + runit-сервисы внутри).
; Обёртка (arch/pgworker/01-placement.md §1): launch.sh ставит `runsvdir -P` — runsv в своих
; группах, групповой stop supervisord'а их не достаёт; обёртка
; гасит runit-дерево сама, иначе сироты держат supervise/lock и Patroni
; следующего `start spilo` не стартует никогда.
; Старт — командой агента pgnode после доставки секретов (arch/pgworker/01-placement.md §1/§4).
; Групповые сигналы ВЫКЛЮЧЕНЫ (t05-факт, прецедент pgnode ниже): часть
; детей spilo-дерева наследует pgid supervisord'а, killasgroup по
; stopwaitsecs (10 с) превращался в killpg ОБЩЕЙ группы — supervisord гасил
; сам себя (контейнер exited 137), нода пересоздавалась надзором с новым
; StartedAt (факт E2E-ротации: apply → рестарт spilo → смерть контейнера на
; 10-й секунде). Обёртка при SIGTERM гасит дерево сама — групповой kill не
; нужен.
command=/spilo-supervised.sh
autostart=false
priority=10
autorestart=true
startsecs=10
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pg_doorman]
; Пулер :6432 ОБЯЗАТЕЛЕН (P13/P14/P15/P17, arch/pgworker/08-operability.md §5): конфиг — позиционный
; аргумент tmpfs (рендерит агент PgNode); TLS-файлы — /run/pgw/doorman/tls.*.
; Отказ старта (нет бинарника/конфига) — главным entrypoint'ом,
; контейнер гаснет. Паттерн надёжности как у pgnode: рестарты ТОЛЬКО
; падений проработавшего процесса; старт-отказ конфига — FATAL без ретраев.
; user=postgres — пулеру root не нужен: конфиг и TLS-файлы рендерит агент
; PgNode (0600, владелец postgres).
command=/usr/local/bin/pg_doorman /run/pgw/doorman/pg_doorman.yaml
autostart=false
priority=30
user=postgres
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pgnode]
; Агент PgNode (t25/t05, arch/backups/02-wal-archive.md §1, arch/pgworker/01-placement.md §1): self-contained бинарь /opt/pgw-node
; (сборка образа — двухшаговая: publish на хосте, см. docker/node/Dockerfile).
; Условность запуска обеспечивает сам бинарь: отсутствие PGW_BACKUP_* —
; старт-отказ с ненулевым exit (окно диагностики в /dev/stdout), supervisord
; его НЕ перезапускает (autorestart=unexpected + exitcodes=0 + startretries=0:
; рестарты ТОЛЬКО падений проработавшего процесса; старт-отказ до startsecs —
; FATAL без ретраев, «не лупит» — spec §3.2). user=postgres — доступ к pg_wal
; PGDATA (fallback .history, §3).
command=/opt/pgw-node/pgnode
priority=40
user=postgres
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=0
; Групповые сигналы pgnode ВЫКЛЮЧЕНЫ (t05-факт): дети наследуют pgid
; supervisord'а, killasgroup при stop-таймауте graceful-шutdown'а агента
; (Kestrel-соединения) превращался в killpg ОБЩЕЙ группы — supervisord гасил
; сам себя (контейнер exited 137, docker перезапускал по unless-stopped).
; pgnode — управляемый .NET-процесс без детей: потоки гасятся с процессом.
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
