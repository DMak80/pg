; Супервизор узла EtcdNode (arch/etcdnode/01-agent.md §1): etcd и агент —
; равноправные программы; смерть любого — autorestart. Флаги etcd — env
; ETCD_ARGS (их формирует EtcdNodeSpecBuilder воркера).
; startsecs=0 + высокий startretries: быстрые краши fail-fast старта
; (невалидный env/PEM) перезапускаются неограниченно (до исчерпания
; startretries; дефолтные startsecs=1/startretries=3 дали бы FATAL
; навсегда — contradict канону «supervisord перезапустит при отказе»).

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:etcd]
command=/bin/sh -c "exec etcd $ETCD_ARGS"
directory=/etcd-data
autorestart=true
startsecs=0
startretries=10
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:etcdnode]
command=/opt/etcdnode/EtcdNode.App
autorestart=true
startsecs=0
startretries=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
