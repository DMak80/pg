# Вторые инстансы воркеров (t07, arch/14 §2): SPOF надзора устранён дефолтом —
# по два контейнера каждого воркера, координацию разбирает etcd (клэймы
# мигрируют ≤ TTL 15 c). Отличие второго сервиса ТОЛЬКО в публикации порта и
# AdvertiseUrl: env/volumes/build — общие анкоры (merge keys). Тома снапшотов
# и TLS — ОБЩИЕ на оба инстанса (лидерство снапшотов мигрирует между ними).
# Запуск PgWorker (spec §5.4, §10): docker.sock (plain на одном хосте /
# swarm manager), том снапшотов P12, секреты per-install из env (Д7).
# etcd запускается отдельно: HA-контур — deploy/etcd/ на 3 хостах (arch/04 §8);
# не-HA прогон — один endpoint.
x-pgworker-env: &pgworker-env
  # Обязательные секреты установки (Д7): не в git, не в etcd.
  PGW_PG_SUPERUSER_PASSWORD: ${PGW_PG_SUPERUSER_PASSWORD:?задайте секрет}
  PGW_PG_STANDBY_PASSWORD: ${PGW_PG_STANDBY_PASSWORD:?задайте секрет}
  PGW_BUCKET_ADMIN_PASSWORD: ${PGW_BUCKET_ADMIN_PASSWORD:?задайте секрет}
  PGW_BUCKET_MOVER_PASSWORD: ${PGW_BUCKET_MOVER_PASSWORD:?задайте секрет}
  # Конфигурация — env-оверрайды appsettings (пример: endpoints etcd).
  # HA-контур контроль-плейна (t09, arch/04 §8): список ВСЕХ клиентских URL;
  # дефолты — стендовые публикации (as-etcd-1/2/3), прод переопределяет в
  # deploy/.env на адреса узлов deploy/etcd. Узла 2/3 может не быть (не-HA
  # прогон) — failover переберёт список, недоступный endpoint пропускается.
  PgWorker__Etcd__Endpoints__0: ${PGW_ETCD_ENDPOINT_0:-http://host.docker.internal:2379}
  PgWorker__Etcd__Endpoints__1: ${PGW_ETCD_ENDPOINT_1:-http://host.docker.internal:2381}
  PgWorker__Etcd__Endpoints__2: ${PGW_ETCD_ENDPOINT_2:-http://host.docker.internal:2383}
  # Advertised-имя docker-хоста в portalloc/dsn (advertised-правило arch/16,
  # симметрия KafkaWorker:AdvertisedClientHost): адреса нод в etcd обязаны
  # быть резолвимы клиентами — панель пробирует host.docker.internal:15xxx/
  # 18xxx; внутреннее имя "local" резолвится только контейнерами воркеров
  # (extra_hosts), панель видела DNS-таймауты проб. Пусто (прод/мульти-хост)
  # → имя docker-хоста как есть.
  PgWorker__Docker__AdvertisedHost: ${PGW_ADVERTISED_HOST:-host.docker.internal}
  # HTTP API воркера (arch/14 §1.1, t03): mTLS-only грань — advertise
  # https://, ключи-серты из /tls (per-install пакет kfw-install-ca);
  # демо-сид POST /api/seed/demo за флагом (стенд; прод — false).
  # X-Api-Key удалён (t03) — аутентификация транспортная (mTLS).
  # AdvertiseUrl ЗАДАЁТСЯ В СЕРВИСАХ (уникален per инстанс, t07).
  PGW_API_TLS_CERT_PATH: /tls/pgserver.crt
  PGW_API_TLS_KEY_PATH: /tls/pgserver.key
  PGW_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
  # REST-TLS нод (t22, arch/14 §8): per-install CA + ключ выпуска сертов
  PGW_REST_TLS_CA_PATH: /tls/ca.pem
  PGW_REST_TLS_CA_KEY_PATH: /tls/ca.key
  PgWorker__Api__EnableSeedEndpoint: ${PGW_API_ENABLE_SEED:-false}
  # Подсистема бэкапов (arch/19, t36): пул S3 per-cluster — policy кластера
  # ссылается пул /s3/clusters/ (выбор — панель, «Пул бэкапов»); endpoint/креды
  # единого S3 ушли, env-профили кредов едут env_file (x-pgworker-base).
  # Пустой Bucket валиден при Enabled=false (валидация старта воркера).
  PgWorker__Backups__Enabled: ${PGW_BACKUPS_ENABLED:-false}
  PgWorker__Backups__S3__Bucket: ${PGW_BACKUP_S3_BUCKET:-}
  # Доверие CA https S3-целей (t42, arch/19 §7): путь ca.pem в контейнере
  # (ro-монтирование TLS-пакета, прод); единый на все цели. Пусто — http.
  PgWorker__Backups__S3__CaBundlePath: ${PGW_BACKUP_S3_CA_BUNDLE_PATH:-}
  # Образ джоба полного бэкапа (t02): тег = дефолт Job.Image; сборка —
  # build-сервис pgworker-backup ниже (compose build) или 00-up.sh.
  PgWorker__Backups__Job__Image: ${PGW_BACKUP_JOB_IMAGE:-pgworker-backup:dev}
  # Экспорт etcd-снапшотов в S3 (t36, arch/14 §6/§8): ОТДЕЛЬНАЯ env-пара
  # PgWorker:Snapshots:Export:S3 (свой bucket, префикс etcd/, свои креды —
  # PGW_SNAPSHOTS_S3_*); обязательна при Enabled=true (fail-fast старта).
  # false → sink не подключается (поведение прежнее).
  PgWorker__Snapshots__Export__Enabled: ${PGW_SNAPSHOTS_EXPORT_ENABLED:-false}
  PgWorker__Snapshots__Export__S3__Endpoint: ${PGW_SNAPSHOTS_S3_ENDPOINT:-}
  PgWorker__Snapshots__Export__S3__Bucket: ${PGW_SNAPSHOTS_S3_BUCKET:-}
  PgWorker__Snapshots__Export__S3__AccessKey: ${PGW_SNAPSHOTS_S3_ACCESS_KEY:-}
  PgWorker__Snapshots__Export__S3__SecretKey: ${PGW_SNAPSHOTS_S3_SECRET_KEY:-}
  PgWorker__Snapshots__Export__S3__Region: ${PGW_SNAPSHOTS_S3_REGION:-}
  PgWorker__Snapshots__Export__S3__CaBundlePath: ${PGW_SNAPSHOTS_S3_CA_BUNDLE_PATH:-}
  # PGTune-параметры PG-нод (arch/14 §2.1/§8): postgresql.conf ноды
  # рассчитывается при СОЗДАНИИ контейнера; память/CPU — из etcd-заявок
  # request_{cpu,mem} ноды (НЕ env), остальное — эти константы; канон P3
  # (wal_level=logical, walsenders) перекрывает расчёт; doorman =
  # Connections − 5 (P15). DbType=desktop запрещён (fail-fast старта).
  PgWorker__Pgtune__DbVersion: ${PGW_PGTUNE_DB_VERSION:-18}
  PgWorker__Pgtune__DbType: ${PGW_PGTUNE_DB_TYPE:-oltp}
  PgWorker__Pgtune__HdType: ${PGW_PGTUNE_HD_TYPE:-ssd}
  PgWorker__Pgtune__DbSize: ${PGW_PGTUNE_DB_SIZE:-mid_ram}
  PgWorker__Pgtune__Connections: ${PGW_PGTUNE_CONNECTIONS:-60}
  # ExcludeParams — env-массив задаётся ЦЕЛИКОМ (__0/__1 заменяют appsettings);
  # io_method/io_workers выключены, пока Spilo-18 не проверен на liburing.
  PgWorker__Pgtune__ExcludeParams__0: ${PGW_PGTUNE_EXCLUDE_0:-io_method}
  PgWorker__Pgtune__ExcludeParams__1: ${PGW_PGTUNE_EXCLUDE_1:-io_workers}
  # Сеть контура скрейпа (t15, arch/18 §5.4): имя сети, к которой движок
  # Ensure-attach'ит создаваемые ноды; portalloc несёт alias/net,
  # sd-generator строит таргеты <alias>:8008 (arch/14 §2.4). Пусто —
  # деградационный контур без сетевой идентичности (advertised-таргеты).
  PgWorker__Docker__ScrapeNetwork: ${PGW_SCRAPE_NETWORK:-pgw-metrics}
  # Сеть контура поставки (t41, arch/14 §2.1): задана → ноды/wal-агенты/
  # ephemeral-джобы бэкапов создаются в ней одной (pgw-net-<C> не создаётся,
  # extra_hosts спек не применяются); пусто — прод-режим (канон arch/14).
  PgWorker__Docker__ContourNetwork: ${PGW_CONTOUR_NETWORK:-}

x-pgworker-base: &pgworker-base
  build:
    context: ..
    dockerfile: docker/PgWorker.Dockerfile
  image: pgworker:dev
  restart: unless-stopped
  # t36 (arch/19 §7): env-профили кредов пулов — env_file БЕЗ интерполяции
  # (дефис в имени профиля compose-${…} не ест; прецедент s3w-node-secrets.env).
  # Файл per-install (в git НЕ попадает; стенд — собирает 00-up.sh из .env
  # по префиксу PGW_BACKUP_S3_PROFILES__, прод — оператор сам). Пустой файл
  # валиден: грань выключена (Enabled=false).
  env_file:
    - ./pgw-s3-profiles.env
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - pgw-snapshots:/snapshots
    # mTLS HTTP API (t03, arch/14 §1.1): per-install пакет kfw-install-ca
    # (bash deploy/tls/gen.sh; наполнение volume — dev-stand 00-up.sh).
    - pgw-api-tls:/tls:ro
    # RBAC вместо сокета наружу (arch/14 §2.2.1, НЕ включено: текущие стенды
    # работают root'ом контейнера): выделенный пользователь + группа docker
    # host-машины — раскомментировать и указать gid (getent group docker):
    #   user: "10001:10001"
    #   group_add: ["<gid docker>"]
    # и заменить bind сокета на tcp://…:2376 (mTLS, deploy/tls/gen-docker.sh).
  extra_hosts:
    # Ноды несут docker-хост "local" (appsettings Docker:Hosts) и пробируются
    # по этому имени; из контейнера резолвим его в docker-хост
    # (на Docker Desktop = host.docker.internal, на Linux — шлюз bridge).
    - "local:host-gateway"
    # advertised-хост записей portalloc/dsn — резолвим и его (Linux-паритет;
    # Docker Desktop резолвит сам, extra_hosts безвреден).
    - "host.docker.internal:host-gateway"

# KafkaWorker (arch/16 §2.1/§8): docker.sock, том снапшотов P12.
# Env-секретов per-install нет (единственный секрет — per-cluster
# app_password в etcd). AdvertiseUrl — в сервисах (уникален per инстанс).
x-kafkaworker-env: &kafkaworker-env
  # HA-контур (t09, arch/04 §8): список ВСЕХ клиентских URL (дефолты — стендовые
  # публикации as-etcd-1/2/3; узла 2/3 может не быть — failover переберёт список).
  KafkaWorker__Etcd__Endpoints__0: ${KFW_ETCD_ENDPOINT_0:-http://host.docker.internal:2379}
  KafkaWorker__Etcd__Endpoints__1: ${KFW_ETCD_ENDPOINT_1:-http://host.docker.internal:2381}
  KafkaWorker__Etcd__Endpoints__2: ${KFW_ETCD_ENDPOINT_2:-http://host.docker.internal:2383}
  # Advertised-хост CLIENT-listener → endpoints в etcd резолвимы клиентами
  # (arch/16 advertised-правило; null допустим только когда имя docker-хоста
  # резолвимо клиентами само по себе).
  KafkaWorker__AdvertisedClientHost: ${KFW_ADVERTISED_CLIENT_HOST:-host.docker.internal}
  # HTTP API воркера (arch/16 §1.1): advertise-URL https:// в /kafkaworker/api/<id>,
  # mTLS-серты из /tls, демо-сид за флагом (стенд; прод — false). KFW_API_KEY
  # удалён (t03) — грань mTLS-only.
  KFW_API_TLS_CERT_PATH: /tls/server.crt
  KFW_API_TLS_KEY_PATH: /tls/server.key
  KFW_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
  KafkaWorker__Api__EnableSeedEndpoint: ${KFW_API_ENABLE_SEED:-false}

x-kafkaworker-base: &kafkaworker-base
  build:
    context: ..
    dockerfile: docker/KafkaWorker.Dockerfile
  image: kafkaworker:dev
  restart: unless-stopped
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - kfw-snapshots:/snapshots
    # mTLS HTTP API (t03, arch/16 §1.1): per-install TLS-пакет из deploy/tls
    # (генерация — bash deploy/tls/gen.sh; наполнение volume — 00-up.sh стенда).
    - kfw-api-tls:/tls:ro
  extra_hosts:
    # docker-хост "local" (appsettings KafkaWorker:Docker:Hosts) — из контейнера
    # резолвим его в шлюз docker-хоста (прецедент pgworker выше).
    - "local:host-gateway"

# ValkeyWorker (arch/21 §2/§8): docker.sock, том снапшотов P12. Хост-порт API
# 8082 — продолжение ряда pg 8080 / kfw 8081. Томов данных нод НЕТ
# (persistence off — томов у домена не бывает). AdvertiseUrl — в сервисах.
x-valkeyworker-env: &valkeyworker-env
  # HA-контур (t09, arch/04 §8): список ВСЕХ клиентских URL (дефолты — стендовые
  # публикации as-etcd-1/2/3; узла 2/3 может не быть — failover переберёт список).
  ValkeyWorker__Etcd__Endpoints__0: ${VWK_ETCD_ENDPOINT_0:-http://host.docker.internal:2379}
  ValkeyWorker__Etcd__Endpoints__1: ${VWK_ETCD_ENDPOINT_1:-http://host.docker.internal:2381}
  ValkeyWorker__Etcd__Endpoints__2: ${VWK_ETCD_ENDPOINT_2:-http://host.docker.internal:2383}
  # Advertised-хост клиентского порта нод → endpoints в etcd резолвимы
  # клиентами (arch/21 §2 advertised-правило).
  ValkeyWorker__AdvertisedClientHost: ${VWK_ADVERTISED_CLIENT_HOST:-host.docker.internal}
  # HTTP API воркера (arch/21 §1.1): advertise-URL https:// в /valkeyworker/api/<id>,
  # mTLS-серты из /tls, демо-сид за флагом (стенд; прод — false).
  VWK_API_TLS_CERT_PATH: /tls/server.crt
  VWK_API_TLS_KEY_PATH: /tls/server.key
  VWK_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
  ValkeyWorker__Api__EnableSeedEndpoint: ${VWK_API_ENABLE_SEED:-false}

x-valkeyworker-base: &valkeyworker-base
  build:
    context: ..
    dockerfile: docker/ValkeyWorker.Dockerfile
  image: valkeyworker:dev
  restart: unless-stopped
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - vw-snapshots:/snapshots
    # mTLS HTTP API (arch/21 §1.1): per-install TLS-пакет из deploy/tls
    # (генерация — bash deploy/tls/gen.sh; наполнение volume — 00-up.sh стенда).
    - vw-api-tls:/tls:ro
  extra_hosts:
    # docker-хост "local" (appsettings Docker:Hosts) + advertised-хост нод —
    # из контейнера резолвим их в шлюз docker-хоста.
    - "local:host-gateway"
    - "host.docker.internal:host-gateway"

x-s3worker-env: &s3worker-env
  # HA-контур (arch/23 §8): список ВСЕХ клиентских URL (дефолты — стендовые
  # публикации as-etcd-1/2/3; узла 2/3 может не быть — failover переберёт).
  S3Worker__Etcd__Endpoints__0: ${S3W_ETCD_ENDPOINT_0:-http://host.docker.internal:2379}
  S3Worker__Etcd__Endpoints__1: ${S3W_ETCD_ENDPOINT_1:-http://host.docker.internal:2381}
  S3Worker__Etcd__Endpoints__2: ${S3W_ETCD_ENDPOINT_2:-http://host.docker.internal:2383}
  # Advertised-хост S3-порта нод → endpoints в etcd резолвимы клиентами
  # (arch/23 §2.1 advertised-правило).
  S3Worker__Docker__AdvertisedHost: ${S3W_ADVERTISED_HOST:-host.docker.internal}
  # Сеть контура (t41-симметрия PgWorker): задана → ноды пулов /s3/ создаются
  # в ней одной (стенд — adminpanel-stand-net: панель/pgworker/jobs достают
  # ноды и по имени сети); пусто — прод-режим (de-facto-сеть docker-хоста).
  S3Worker__Docker__ContourNetwork: ${PGW_CONTOUR_NETWORK:-}
  # per-install bucket (arch/19 §5; env S3W_BUCKET — fail-fast старта).
  S3Worker__Bucket: ${S3W_BUCKET:?задайте bucket per-install}
  # HTTP API воркера (arch/24 §1.1): mTLS-серты из /tls (env-фоллбек до
  # ключа /workers/api_tls/s3worker от панели t34), демо-сид за флагом.
  S3W_API_TLS_CERT_PATH: /tls/server.crt
  S3W_API_TLS_KEY_PATH: /tls/server.key
  S3W_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
  S3Worker__Api__EnableSeedEndpoint: ${S3W_API_ENABLE_SEED:-false}

x-s3worker-base: &s3worker-base
  build:
    context: ..
    dockerfile: docker/S3Worker.Dockerfile
    args:
      S3W_PUBLISH_DIR: artifacts/s3worker/publish
  image: s3worker:dev
  restart: unless-stopped
  # Профили секретов нод (arch/23 §6) — env_file БЕЗ интерполяции: имена
  # S3W_NODE_SECRETS__<PROFILE>__* допускают дефис в <PROFILE>, который
  # compose-парсер ${...} читает как оператор дефолта (секрет не доезжает).
  # Файл per-install (в git НЕ попадает); формат — те же строки KEY=VAL,
  # что в .env; отсутствие файла = падение up (fail-fast).
  env_file:
    - ./s3w-node-secrets.env
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - s3w-snapshots:/snapshots
    # mTLS HTTP API (arch/24 §1.1): общий TLS-volume pgw-api-tls (server-серт
    # kfw/vwk-ряда с SAN s3worker*, deploy/tls/gen.sh); наполнение — 00-up.sh.
    - pgw-api-tls:/tls:ro
  extra_hosts:
    # docker-хост "local" (appsettings Docker:Hosts) + advertised-хост нод —
    # из контейнера резолвим их в шлюз docker-хоста.
    - "local:host-gateway"
    - "host.docker.internal:host-gateway"

services:
  pgworker:
    <<: *pgworker-base
    ports:
      # Хост-публикация API параметризуется (коллизии на хосте, прецедент
      # METRICS_*_PORT стенда); внутри контейнера канонический 8080.
      - "${PGW_API_HOST_PORT:-8080}:8080"
    networks:
      # default сохраняется явно: compose не подключает default при указанном networks.
      default: {}
      # Единая сеть контура мониторинга (t15, arch/18 §5.4): Prometheus
      # (external-attach стендового компоуза) скрейпит воркеров по alias.
      pgw-metrics:
        aliases: [pgworker]
    environment:
      <<: *pgworker-env
      PgWorker__Api__AdvertiseUrl: ${PGW_API_ADVERTISE_URL:-https://host.docker.internal:${PGW_API_HOST_PORT:-8080}}

  # Второй инстанс PgWorker (t07, arch/14 §2): тот же образ/секреты/тома;
  # отличается ТОЛЬКО порт публикации (ряд 8080→8083) и AdvertiseUrl —
  # advertise следует за портом автоматически (compose-дефолт, отдельная
  # env не нужна). container_name НЕ задаём (compose: deploy-pgworker-2-1).
  pgworker-2:
    <<: *pgworker-base
    ports:
      - "${PGW_API_HOST_PORT2:-8083}:8080"
    networks:
      default: {}
      # Единая сеть контура мониторинга (t15): alias pgworker-2 — сетевой
      # таргет джобы pgworker (SAN серта pgserver покрывает, deploy/tls/gen.sh).
      pgw-metrics:
        aliases: [pgworker-2]
    environment:
      <<: *pgworker-env
      PgWorker__Api__AdvertiseUrl: https://host.docker.internal:${PGW_API_HOST_PORT2:-8083}

  kafkaworker:
    <<: *kafkaworker-base
    ports:
      - "8081:8080" # /healthz (8081 — не конфликтует с pgworker)
    environment:
      <<: *kafkaworker-env
      KafkaWorker__Api__AdvertiseUrl: ${KFW_API_ADVERTISE_URL:-https://host.docker.internal:8081}

  # Второй инстанс KafkaWorker (t07, arch/16 §2.1): ряд 8081→8084; advertise
  # следует за портом (compose-дефолт). Тома kfw-snapshots/kfw-api-tls — общие.
  kafkaworker-2:
    <<: *kafkaworker-base
    ports:
      - "${KFW_API_HOST_PORT2:-8084}:8080"
    environment:
      <<: *kafkaworker-env
      KafkaWorker__Api__AdvertiseUrl: https://host.docker.internal:${KFW_API_HOST_PORT2:-8084}

  valkeyworker:
    <<: *valkeyworker-base
    ports:
      - "${VWK_API_HOST_PORT:-8082}:8080" # /healthz (ряд pg 8080 / kfw 8081 / vwk 8082)
    environment:
      <<: *valkeyworker-env
      ValkeyWorker__Api__AdvertiseUrl: ${VWK_API_ADVERTISE_URL:-https://host.docker.internal:8082}

  # Второй инстанс ValkeyWorker (t07, arch/21 §2): ряд 8082→8085; advertise
  # следует за портом (compose-дефолт). Тома vw-snapshots/vw-api-tls — общие.
  valkeyworker-2:
    <<: *valkeyworker-base
    ports:
      - "${VWK_API_HOST_PORT2:-8085}:8080"
    environment:
      <<: *valkeyworker-env
      ValkeyWorker__Api__AdvertiseUrl: https://host.docker.internal:${VWK_API_HOST_PORT2:-8085}

  # S3Worker (arch/24): оркестратор кластеров S3-хранилища бэкапов (префикс
  # /s3/ + координация /s3worker/); портовой ряд 8086 (после pg 8080-8083 /
  # kfw 8081-8084 / vwk 8082-8085); ноды кластеров он поднимает сам.
  s3worker:
    <<: *s3worker-base
    ports:
      - "${S3W_API_HOST_PORT:-8086}:8080"
    environment:
      <<: *s3worker-env
      S3Worker__Api__AdvertiseUrl: ${S3W_API_ADVERTISE_URL:-https://host.docker.internal:${S3W_API_HOST_PORT:-8086}}

  # Второй инстанс S3Worker (arch/24 §2): ряд 8086→8089; advertise следует
  # за портом (compose-дефолт). Том s3w-snapshots — общий.
  s3worker-2:
    <<: *s3worker-base
    ports:
      - "${S3W_API_HOST_PORT2:-8089}:8080"
    environment:
      <<: *s3worker-env
      S3Worker__Api__AdvertiseUrl: https://host.docker.internal:${S3W_API_HOST_PORT2:-8089}

  # ownS3 (arch/owns3/01, 05 §6): хранилище бэкапов стенда (стенд: alias
  # `owns3` в стендовой сети — override `docker-compose.contour.yml`,
  # `:9010` — наружу); as-minio полного стенда — переходный read-only-архив
  # (docs/owns3-migration.md). standalone-сервис: без etcd, без docker.sock;
  # один процесс, один том.
  owns3:
    build:
      context: ..
      dockerfile: docker/OwnS3.Dockerfile
      args:
        OWNS3_PUBLISH_DIR: artifacts/owns3/publish
    image: owns3:dev
    restart: unless-stopped
    ports:
      # 9000/9001 хоста заняты as-minio полного стенда — ownS3 продолжает
      # портовой ряд (канон 05 §6); внутри контейнера канонический 9000.
      - "${OWNS3_HOST_PORT:-9010}:9000"
    environment:
      OWNS3_ROOT_USER: ${OWNS3_ROOT_USER:?задайте секрет}
      OWNS3_ROOT_PASSWORD: ${OWNS3_ROOT_PASSWORD:?задайте секрет}
      # Статические ключи (arch/owns3/05 §2): writer подсистемы бэкапов
      # (= PGW_BACKUP_S3_* — один комплект, arch/19 §7) + read-only панель.
      # Пустые значения безопасны: сервис читает их напрямую и стоп на
      # первом пустом индексе (только root).
      OWNS3_ACCESS_KEYS__0__ACCESSKEY: ${OWNS3_ACCESS_KEYS__0__ACCESSKEY:-}
      OWNS3_ACCESS_KEYS__0__SECRETKEY: ${OWNS3_ACCESS_KEYS__0__SECRETKEY:-}
      OWNS3_ACCESS_KEYS__0__POLICY: ${OWNS3_ACCESS_KEYS__0__POLICY:-}
      OWNS3_ACCESS_KEYS__1__ACCESSKEY: ${OWNS3_ACCESS_KEYS__1__ACCESSKEY:-}
      OWNS3_ACCESS_KEYS__1__SECRETKEY: ${OWNS3_ACCESS_KEYS__1__SECRETKEY:-}
      OWNS3_ACCESS_KEYS__1__POLICY: ${OWNS3_ACCESS_KEYS__1__POLICY:-}
    volumes:
      - owns3-data:/data
  # TLS-опция ПРОД-инсталляции (t42, arch/owns3/05 §6): раскомментировать —
  # грань станет HTTPS-only на том же порту 9000 (серт owns3 из deploy/tls/gen.sh,
  # PEM-альтернатива — OWNS3_TLS_CERT/KEY). Добавить строку к volumes выше и
  # ключи к environment выше. Стенд живёт HTTP-only — не включать.
  #   - ./tls:/tls:ro
  # environment:
  #   OWNS3_TLS_CERT_PATH: /tls/owns3.crt
  #   OWNS3_TLS_KEY_PATH: /tls/owns3.key

  # ownS3 XL Erasure (t40, arch/owns3/06 §1): второй режим хранения — тот же
  # образ owns3:dev (build НЕ дублируется: профиль поднимается на образе,
  # собранном сервисом owns3 / 00-up.sh), 4 тома под /data1../data4 (сет 3+1).
  # Профиль owns3-ec — явно: `docker compose --profile owns3-ec up -d owns3-ec`.
  # Контур standalone: без etcd, без docker.sock.
  owns3-ec:
    image: owns3:dev
    restart: unless-stopped
    profiles: ["owns3-ec"]
    ports:
      # продолжение портового ряда ownS3 (single 9010 → EC 9011, канон 05 §8)
      - "${OWNS3_EC_HOST_PORT:-9011}:9000"
    environment:
      OWNS3_ROOT_USER: ${OWNS3_ROOT_USER:?задайте секрет}
      OWNS3_ROOT_PASSWORD: ${OWNS3_ROOT_PASSWORD:?задайте секрет}
      OWNS3_DATA_DIR: /data1,/data2,/data3,/data4
      OWNS3_EC_SET_SIZE: "4"
      OWNS3_EC_PARITY: "1"
    volumes:
      - owns3-ec-data-1:/data1
      - owns3-ec-data-2:/data2
      - owns3-ec-data-3:/data3
      - owns3-ec-data-4:/data4

  # Mesh-репликация ownS3 (t35, arch/owns3/07): пул 2–5 серверов на разных
  # docker-хостах (гео). Профиль owns3-mesh — ДЕМОНСТРАЦИЯ 2 узлов одной сети
  # (прод — узлы на разных хостах, endpoint — advertised host:port). Каждый узел
  # знает соседа (env-seed первого старта; состав живого пула меняется
  # PUT /admin/replication/targets без даунтайма — глава 07 §2). Peer-ключи
  # ПЕР-УЗЛОВЫЕ (os3m-peer-1 / os3m-peer-2, policy=replication — задайте в
  # OWNS3_ACCESS_KEYS__2__*/__3__*: accessKey — идентификатор источника на
  # приёмнике, дедуп (источник, seqNo) при общих кредах гасит события).
  # Приёмка — docker-E2E серии E2e.Replication (A1–A14).
  # Подъём: `docker compose --profile owns3-mesh up -d owns3-m1 owns3-m2`.
  owns3-m1:
    image: owns3:dev
    restart: unless-stopped
    profiles: ["owns3-mesh"]
    ports:
      - "${OWNS3_MESH1_HOST_PORT:-9012}:9000"
    environment:
      OWNS3_ROOT_USER: ${OWNS3_ROOT_USER:?задайте секрет}
      OWNS3_ROOT_PASSWORD: ${OWNS3_ROOT_PASSWORD:?задайте секрет}
      OWNS3_HOST_ID: mesh-node-1
      # Исходящий peer-ключ УЗЛА 1 (его подпись резолвится у соседа как mesh-node-1)
      OWNS3_ACCESS_KEYS__2__ACCESSKEY: ${OWNS3_MESH_PEER1_ACCESSKEY:?задайте peer-ключ узла 1}
      OWNS3_ACCESS_KEYS__2__SECRETKEY: ${OWNS3_MESH_PEER1_SECRETKEY:?задайте peer-ключ узла 1}
      OWNS3_ACCESS_KEYS__2__POLICY: replication
      OWNS3_REPLICATION_TARGETS__0__NAME: mesh-node-2
      OWNS3_REPLICATION_TARGETS__0__ENDPOINT: http://owns3-m2:9000
      # Креды СОСЕДА (узла 2) — их источник предъявляет при подписи
      OWNS3_REPLICATION_TARGETS__0__ACCESSKEY: ${OWNS3_MESH_PEER2_ACCESSKEY:?задайте peer-ключ узла 2}
      OWNS3_REPLICATION_TARGETS__0__SECRETKEY: ${OWNS3_MESH_PEER2_SECRETKEY:?задайте peer-ключ узла 2}
    volumes:
      - owns3-m1-data:/data
  owns3-m2:
    image: owns3:dev
    restart: unless-stopped
    profiles: ["owns3-mesh"]
    ports:
      - "${OWNS3_MESH2_HOST_PORT:-9013}:9000"
    environment:
      OWNS3_ROOT_USER: ${OWNS3_ROOT_USER:?задайте секрет}
      OWNS3_ROOT_PASSWORD: ${OWNS3_ROOT_PASSWORD:?задайте секрет}
      OWNS3_HOST_ID: mesh-node-2
      # Исходящий peer-ключ УЗЛА 2
      OWNS3_ACCESS_KEYS__2__ACCESSKEY: ${OWNS3_MESH_PEER2_ACCESSKEY:?задайте peer-ключ узла 2}
      OWNS3_ACCESS_KEYS__2__SECRETKEY: ${OWNS3_MESH_PEER2_SECRETKEY:?задайте peer-ключ узла 2}
      OWNS3_ACCESS_KEYS__2__POLICY: replication
      OWNS3_REPLICATION_TARGETS__0__NAME: mesh-node-1
      OWNS3_REPLICATION_TARGETS__0__ENDPOINT: http://owns3-m1:9000
      OWNS3_REPLICATION_TARGETS__0__ACCESSKEY: ${OWNS3_MESH_PEER1_ACCESSKEY:?задайте peer-ключ узла 1}
      OWNS3_REPLICATION_TARGETS__0__SECRETKEY: ${OWNS3_MESH_PEER1_SECRETKEY:?задайте peer-ключ узла 1}
    volumes:
      - owns3-m2-data:/data

  # Образ джоба полного бэкапа (t02, arch/19 §2): только сборка — сервиса нет,
  # джобы запускает PgWorker как ephemeral-контейнеры. Профиль build не даёт
  # подняться в up; entrypoint-заглушка — защита от случайного run.
  pgworker-backup:
    build:
      context: ..
      dockerfile: docker/PgWorker.Backup.Dockerfile
    image: pgworker-backup:dev
    profiles: ["build"]
    entrypoint: ["true"]

  # Образ wal-агента (t27/t41, arch/19 §3): publish НА ХОСТЕ (00-up.sh,
  # [PHASE]) → compose build пакует только вывод (канон E2E-образов).
  pgworker-wal:
    build:
      context: ..
      dockerfile: docker/PgWorker.Wal.Dockerfile
      args:
        WAL_PUBLISH_DIR: artifacts/wal/publish
    image: pgworker-wal:dev
    profiles: ["build"]
    entrypoint: ["true"]

# Единая сеть контура мониторинга (t15, arch/18 §5.4): deploy-проект ВЛАДЕЕТ
# сетью — в ней deploy-воркеры PgWorker (aliases), Prometheus (external-attach
# стендового компоуза) и кластерные ноды (attach движком,
# PgWorker:Docker:ScrapeNetwork). Предсказуемое имя — для внешних потребителей
# (prometheus external-сеть).
networks:
  pgw-metrics:
    name: ${PGW_METRICS_NETWORK:-pgw-metrics}

volumes:
  s3w-snapshots:
  pgw-snapshots:
  pgw-api-tls:
  kfw-snapshots:
  kfw-api-tls:
  vw-snapshots:
  vw-api-tls:
  owns3-data:
  owns3-m1-data:
  owns3-m2-data:
  owns3-ec-data-1:
  owns3-ec-data-2:
  owns3-ec-data-3:
  owns3-ec-data-4:
