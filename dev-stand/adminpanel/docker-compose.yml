# Dev-стенд AdminPanel (arch/04, spec t10): профили quick (etcd+панель) и
# full (+PG-шарды и patroni-эмуляторы); kafka-профиль — живой kafkaworker.
# Сиды наливаются API воркеров (05-seed.sh, spec §3.5) — сервисов сида нет.
# Имена сервисов канонические (DNS сети стенда: на них построены
# DSN/репликация), container_name — с префиксом as- (не конфликтуют со
# стендом pg (монорепозиторий), который порты на хост не публикует; arch/04 §1).
name: adminpanel-stand

# Общий анкор узлов HA-контура (extension-поле — ТОЛЬКО на верхнем уровне
# compose: внутри services ключ x-* compose считает отдельным сервисом).
x-etcd-common: &etcd-common
  image: quay.io/coreos/etcd:v3.5.21
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  healthcheck:
    test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

services:
  # HA-контур: 3 узла ОДНИМ кластером (t09, arch/04 §8; стенд зеркалит прод —
  # надёжность дефолтом, прецедент t07). Peer — compose-DNS; клиентские
  # публикации: 2379 (etcd1 — совместимость инструментария), 2381/2382+1 —
  # etcd2/etcd3 (env-override при коллизиях, прецедент METRICS_*). Advertise
  # двумя URL: etcdN:2379 — потребители сети стенда; host.docker.internal:PORT —
  # Patroni-ноды PgWorker из per-cluster сетей (паттерн прежнего as-etcd).
  # initial-cluster-state=new переживает `docker compose down` (без -v):
  # узел стартует с существующим data-dir и игнорирует bootstrap-флаги
  # (etcd сам видит членство в data-dir); при `down -v` кластер пересобирается
  # с нуля — флаг `new` снова корректен.

  etcd1:
    <<: *etcd-common
    container_name: as-etcd-1
    ports:
      - "${ETCD1_HOST_PORT:-2379}:2379"
    command:
      - etcd
      - --name=etcd1
      - --data-dir=/var/etcd/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --advertise-client-urls=http://etcd1:2379,http://host.docker.internal:${ETCD1_HOST_PORT:-2379}
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=as-etcd-cluster
      - --initial-cluster-state=new
      - --heartbeat-interval=250
      - --election-timeout=2000
      - --auto-compaction-retention=1
    volumes:
      - etcd1-data:/var/etcd/data

  etcd2:
    <<: *etcd-common
    container_name: as-etcd-2
    ports:
      - "${ETCD2_HOST_PORT:-2381}:2379"
    command:
      - etcd
      - --name=etcd2
      - --data-dir=/var/etcd/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --advertise-client-urls=http://etcd2:2379,http://host.docker.internal:${ETCD2_HOST_PORT:-2381}
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=as-etcd-cluster
      - --initial-cluster-state=new
      - --heartbeat-interval=250
      - --election-timeout=2000
      - --auto-compaction-retention=1
    volumes:
      - etcd2-data:/var/etcd/data

  etcd3:
    <<: *etcd-common
    container_name: as-etcd-3
    ports:
      - "${ETCD3_HOST_PORT:-2383}:2379"
    command:
      - etcd
      - --name=etcd3
      - --data-dir=/var/etcd/data
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --advertise-client-urls=http://etcd3:2379,http://host.docker.internal:${ETCD3_HOST_PORT:-2383}
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=as-etcd-cluster
      - --initial-cluster-state=new
      - --heartbeat-interval=250
      - --election-timeout=2000
      - --auto-compaction-retention=1
    volumes:
      - etcd3-data:/var/etcd/data

  # MinIO — S3-хранилище бэкапов (arch/19 §5, t01): каркас подсистемы в
  # стенде; PgWorker (deploy-проект) ходит публикацией host:9000. Креды —
  # стендовые дефолты (ТОЛЬКО локальный стенд; прод — per-install S3, arch/19
  # §7). Bucket pgworker-backups создаёт 00-up.sh (mc mb, идемпотентно).
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: as-minio
    profiles: ["full"]
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - as-minio-data:/data
    healthcheck:
      # mc входит в образ (curl из UBI micro убран) — ready-проба канона MinIO
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Шард 1: s1a (мастер; self-healing — при пустом PGDATA и живом мастере-пире
  # клонируется репликой: повторные прогоны после failover, spec t10 §3) + s1b
  # (физическая реплика через pg_basebackup -R; паттерн arch/stand).
  # Имена sync-standby НЕ запекаются во флаги -c: флаг сильнее ALTER SYSTEM и
  # после promote без реплики повесит коммиты в SyncRep (урок pg (монорепозиторий)) — их
  # ставит 00-up.sh ALTER SYSTEM'ом.
  s1a:
    image: postgres:18
    container_name: as-s1a
    profiles: ["full"]
    ports: ["5433:5432"]
    user: postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: demo
    command:
      - bash
      - -c
      - |
        set -e
        # SSL (adopt-repair): воркер ходит на SQL SSL Mode=Require (контракт
        # прод-Spilo); стендовая нода поднимает self-signed сертификат в /tmp —
        # initdb-каталог не трогаем, флаги прокидываем во все exec postgres.
        openssl req -new -x509 -days 3650 -nodes -subj /CN=pg \
          -keyout /tmp/server.key -out /tmp/server.crt >/dev/null 2>&1
        chmod 600 /tmp/server.key
        PGSSL="-c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key"
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          cloned=0
          for i in $$(seq 1 15); do
            if pg_isready -h s1b -U postgres -q 2>/dev/null \
               && [ "$$(psql -h s1b -U postgres -d postgres -tAc 'select pg_is_in_recovery()' 2>/dev/null)" = "f" ]; then
              echo "s1a: клонируюсь от мастера s1b (self-healing)"
              rm -rf "$$PGDATA"
              psql -h s1b -U postgres -d postgres -tAc "select pg_drop_replication_slot('s1a_phys')" >/dev/null 2>&1 || true
              pg_basebackup -h s1b -U postgres -D "$$PGDATA" -X stream -R -C -S s1a_phys
              chmod 700 "$$PGDATA"
              sed -i "s|^primary_conninfo.*|primary_conninfo = 'host=s1b port=5432 user=postgres dbname=postgres application_name=s1a'|" "$$PGDATA/postgresql.auto.conf"
              exec postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL \
                   -c sync_replication_slots=on -c hot_standby_feedback=on $$PGSSL
            fi
            sleep 1
          done
          echo "s1a: пир s1b не мастер — первый старт, initdb-мастер"
          exec docker-entrypoint.sh postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL
        fi
        exec postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL

  s1b:
    image: postgres:18
    container_name: as-s1b
    profiles: ["full"]
    ports: ["5434:5432"]
    user: postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - bash
      - -c
      - |
        # Реплика шарда 1: клон с retry (ждёт hba/готовность s1a — их патчит
        # 00-up.sh), failover-слоты + application_name для sync-standby.
        set -e
        # SSL (adopt-repair): воркер ходит на SQL SSL Mode=Require (контракт
        # прод-Spilo); стендовая нода поднимает self-signed сертификат в /tmp —
        # initdb-каталог не трогаем, флаги прокидываем во все exec postgres.
        openssl req -new -x509 -days 3650 -nodes -subj /CN=pg \
          -keyout /tmp/server.key -out /tmp/server.crt >/dev/null 2>&1
        chmod 600 /tmp/server.key
        PGSSL="-c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key"
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          while ! pg_basebackup -h s1a -U postgres -D "$$PGDATA" -X stream -R -C -S s1b_phys; do
            echo "s1b: жду s1a (инициализация/hba)..."; sleep 2; rm -rf "$$PGDATA"
          done
          chmod 700 "$$PGDATA"
          sed -i "s|^primary_conninfo.*|primary_conninfo = 'host=s1a port=5432 user=postgres dbname=postgres application_name=s1b'|" "$$PGDATA/postgresql.auto.conf"
        fi
        exec postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL \
             -c sync_replication_slots=on -c hot_standby_feedback=on $$PGSSL
    depends_on: [s1a]

  # Шард 2 — зеркально шарду 1 (s2a self-healing мастер, s2b реплика)
  s2a:
    image: postgres:18
    container_name: as-s2a
    profiles: ["full"]
    ports: ["5435:5432"]
    user: postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: demo
    command:
      - bash
      - -c
      - |
        set -e
        # SSL (adopt-repair): воркер ходит на SQL SSL Mode=Require (контракт
        # прод-Spilo); стендовая нода поднимает self-signed сертификат в /tmp —
        # initdb-каталог не трогаем, флаги прокидываем во все exec postgres.
        openssl req -new -x509 -days 3650 -nodes -subj /CN=pg \
          -keyout /tmp/server.key -out /tmp/server.crt >/dev/null 2>&1
        chmod 600 /tmp/server.key
        PGSSL="-c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key"
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          cloned=0
          for i in $$(seq 1 15); do
            if pg_isready -h s2b -U postgres -q 2>/dev/null \
               && [ "$$(psql -h s2b -U postgres -d postgres -tAc 'select pg_is_in_recovery()' 2>/dev/null)" = "f" ]; then
              echo "s2a: клонируюсь от мастера s2b (self-healing)"
              rm -rf "$$PGDATA"
              psql -h s2b -U postgres -d postgres -tAc "select pg_drop_replication_slot('s2a_phys')" >/dev/null 2>&1 || true
              pg_basebackup -h s2b -U postgres -D "$$PGDATA" -X stream -R -C -S s2a_phys
              chmod 700 "$$PGDATA"
              sed -i "s|^primary_conninfo.*|primary_conninfo = 'host=s2b port=5432 user=postgres dbname=postgres application_name=s2a'|" "$$PGDATA/postgresql.auto.conf"
              exec postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL \
                   -c sync_replication_slots=on -c hot_standby_feedback=on $$PGSSL
            fi
            sleep 1
          done
          echo "s2a: пир s2b не мастер — первый старт, initdb-мастер"
          exec docker-entrypoint.sh postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL
        fi
        exec postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL

  s2b:
    image: postgres:18
    container_name: as-s2b
    profiles: ["full"]
    ports: ["5436:5432"]
    user: postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - bash
      - -c
      - |
        set -e
        # SSL (adopt-repair): воркер ходит на SQL SSL Mode=Require (контракт
        # прод-Spilo); стендовая нода поднимает self-signed сертификат в /tmp —
        # initdb-каталог не трогаем, флаги прокидываем во все exec postgres.
        openssl req -new -x509 -days 3650 -nodes -subj /CN=pg \
          -keyout /tmp/server.key -out /tmp/server.crt >/dev/null 2>&1
        chmod 600 /tmp/server.key
        PGSSL="-c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key"
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          while ! pg_basebackup -h s2a -U postgres -D "$$PGDATA" -X stream -R -C -S s2b_phys; do
            echo "s2b: жду s2a (инициализация/hba)..."; sleep 2; rm -rf "$$PGDATA"
          done
          chmod 700 "$$PGDATA"
          sed -i "s|^primary_conninfo.*|primary_conninfo = 'host=s2a port=5432 user=postgres dbname=postgres application_name=s2b'|" "$$PGDATA/postgresql.auto.conf"
        fi
        exec postgres -c wal_level=logical -c max_wal_senders=16 -c max_replication_slots=16 $$PGSSL \
             -c sync_replication_slots=on -c hot_standby_feedback=on $$PGSSL
    depends_on: [s2a]

  # Patroni-эмуляторы (spec t10 §5): отдельные контейнеры в общей сети,
  # :8008 опубликован на хосте под стендовыми портами (HostMap панели,
  # arch/04 §1). Без restart-политики: рестарт эмулятора не должен
  # реанимировать остановленную ноду (урок pg (монорепозиторий)).
  hc1a:
    build: ./sidecar
    container_name: as-hc1a
    profiles: ["full"]
    ports: ["8011:8008"]
    environment:
      NODE_NAME: s1a
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      CLUSTER: demo
      SHARD: s1
      MEMBERS: s1a,s1b
      HC_TLS_CERT: /tls/hc.crt
      HC_TLS_KEY: /tls/hc.key
    volumes:
      - ../../deploy/tls:/tls:ro
    depends_on: [s1a]

  hc1b:
    build: ./sidecar
    container_name: as-hc1b
    profiles: ["full"]
    ports: ["8012:8008"]
    environment:
      NODE_NAME: s1b
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      CLUSTER: demo
      SHARD: s1
      MEMBERS: s1a,s1b
      HC_TLS_CERT: /tls/hc.crt
      HC_TLS_KEY: /tls/hc.key
    volumes:
      - ../../deploy/tls:/tls:ro
    depends_on: [s1b]

  hc2a:
    build: ./sidecar
    container_name: as-hc2a
    profiles: ["full"]
    ports: ["8021:8008"]
    environment:
      NODE_NAME: s2a
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      CLUSTER: demo
      SHARD: s2
      MEMBERS: s2a,s2b
      HC_TLS_CERT: /tls/hc.crt
      HC_TLS_KEY: /tls/hc.key
    volumes:
      - ../../deploy/tls:/tls:ro
    depends_on: [s2a]

  hc2b:
    build: ./sidecar
    container_name: as-hc2b
    profiles: ["full"]
    ports: ["8022:8008"]
    environment:
      NODE_NAME: s2b
      ETCD_ENDPOINTS: http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
      CLUSTER: demo
      SHARD: s2
      MEMBERS: s2a,s2b
      HC_TLS_CERT: /tls/hc.crt
      HC_TLS_KEY: /tls/hc.key
    volumes:
      - ../../deploy/tls:/tls:ro
    depends_on: [s2b]

  # Панель — ВСЕГДА в докере (AGENTS.md): в сети стенда резолвит ноды напрямую
  # (s1a:5432, patroni :8008, kafka host.docker.internal) — хостовая панель не
  # достаёт до стендовых адресов, её live-пробы таймаутятся (критичный
  # функционал). Без профиля: поднимается и в quick, и в full.
  adminpanel:
    build:
      context: ../..
      dockerfile: docker/AdminPanel.Dockerfile
    image: adminpanel:dev
    container_name: as-adminpanel
    restart: unless-stopped
    ports:
      - "5050:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Stand
      AdminPanel__Etcd__Endpoints__0: http://etcd1:2379
      AdminPanel__Etcd__Endpoints__1: http://etcd2:2379
      AdminPanel__Etcd__Endpoints__2: http://etcd3:2379
      # cookie-логин по http (стенд без TLS)
      AdminPanel__Auth__Username: admin
      AdminPanel__Auth__Password: admin
      AdminPanel__Auth__AllowHttp: "true"
      # kafka-пробы: DescribeCluster/группы через host.docker.internal медленнее
      # 3 c (прецедент хостового дев-конфига)
      AdminPanel__Probes__Kafka__TimeoutSeconds: "10"
      # mTLS API воркеров (t03, arch/02 §2.3.2): ЕДИНЫЙ клиентский серт панели
      # + ServerCA на оба воркера (pgworker и kafkaworker — одна kfw-install-ca).
      # Env-имена — из таблицы WorkerTlsHandler.EnvBindings: Program.cs
      # (ApplyEnvOverrides) перекладывает их в AdminPanel:Workers:WorkerTls:*
      # с точным регистром. Прямые ADMINPANEL__WORKERS__WORKERTLS__* НЕ биндятся:
      # env-провайдер хранит листья верхним регистром, а binder .NET 10 матчит
      # свойства строго (репро 2026-09-05: Get<WorkerApiOptions> с env пуст).
      WORKERS_PANEL_TLS_CERT_PATH: /tls-workers/panel.crt
      WORKERS_PANEL_TLS_KEY_PATH: /tls-workers/panel.key
      WORKERS_PANEL_TLS_SERVER_CA_PATH: /tls-workers/ca.pem
      # t08: грань «Хранилище бэкапов» — read-only инвентарь MinIO из сети
      # стенда (minio:9000 — compose-DNS; панель всегда в докере). Креды —
      # стендовые дефолты as-minio; прод — per-install env (arch/19 §7).
      AdminPanel__Backups__S3__Endpoint: http://minio:9000
      AdminPanel__Backups__S3__Bucket: pgworker-backups
      AdminPanel__Backups__S3__AccessKey: minioadmin
      AdminPanel__Backups__S3__SecretKey: minioadmin
    volumes:
      # HostMap (s1a:8008 → hc1a:8008) — только JSON: env не собирает ключи
      # словаря с "__" (см. комментарий в самом файле)
      - ./adminpanel.appsettings.json:/app/appsettings.Stand.json:ro
      # mTLS kafkaworker (t03): клиентский серт панели + ServerCA
      - ../../deploy/tls:/tls-workers:ro

  # Живой KafkaWorker (план B8): профиль kafka — только явно. Управляет docker-
  # хостом через сокет; advertised host.docker.internal делает endpoints в etcd
  # резолвимыми для клиентов (arch/16 §2.1). Сид kafka-домена наливается его
  # API (05-seed.sh kafka, spec §3.5): пробы контейнеров брокеров слепые →
  # сидовые заявки не исполняются, данные стабильны (arch/16 §5 C).
  kafkaworker:
    build:
      context: ../..
      dockerfile: docker/KafkaWorker.Dockerfile
    image: kafkaworker:dev
    container_name: as-kafkaworker
    restart: unless-stopped
    profiles: ["kafka"]
    ports:
      - "8082:8080" # /healthz + /api (хост-доступ чеков; 8082 — свободен)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kfw-snapshots:/snapshots
      # mTLS HTTP API (t03, arch/16 §1.1): per-install пакет генерирует
      # 00-up.sh (bash deploy/tls/gen.sh, идемпотентно).
      - ../../deploy/tls:/tls:ro
    extra_hosts:
      # docker-хост "local" (appsettings KafkaWorker:Docker:Hosts) — резолвим
      # в шлюз docker-хоста (прецедент pgworker, deploy/docker-compose.yml)
      - "local:host-gateway"
    environment:
      KafkaWorker__Etcd__Endpoints__0: http://etcd1:2379
      KafkaWorker__Etcd__Endpoints__1: http://etcd2:2379
      KafkaWorker__Etcd__Endpoints__2: http://etcd3:2379
      KafkaWorker__AdvertisedClientHost: host.docker.internal
      # HTTP API воркера (arch/16 §1.1, t03): mTLS-only, панель ходит по
      # compose-DNS с клиентским сертом (lease-ключ /kafkaworker/api/<id> —
      # AdvertiseUrl https://), демо-сид включён (стенд).
      KafkaWorker__Api__AdvertiseUrl: https://kafkaworker:8080
      KFW_API_TLS_CERT_PATH: /tls/server.crt
      KFW_API_TLS_KEY_PATH: /tls/server.key
      KFW_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
      KafkaWorker__Api__EnableSeedEndpoint: "true"
    depends_on: [etcd1, etcd2, etcd3]

  # Второй инстанс KafkaWorker (t07, arch/16 §2.1): тот же образ/env/сеть,
  # compose-DNS advertise; БЕЗ хост-публикации порта (панель и Prometheus
  # ходят из сети стенда; хост-порт 8082 остаётся у первого для curl-чеков).
  kafkaworker-2:
    build:
      context: ../..
      dockerfile: docker/KafkaWorker.Dockerfile
    image: kafkaworker:dev
    container_name: as-kafkaworker-2
    restart: unless-stopped
    profiles: ["kafka"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kfw-snapshots:/snapshots
      - ../../deploy/tls:/tls:ro
    extra_hosts:
      - "local:host-gateway"
    environment:
      KafkaWorker__Etcd__Endpoints__0: http://etcd1:2379
      KafkaWorker__Etcd__Endpoints__1: http://etcd2:2379
      KafkaWorker__Etcd__Endpoints__2: http://etcd3:2379
      KafkaWorker__AdvertisedClientHost: host.docker.internal
      KafkaWorker__Api__AdvertiseUrl: https://kafkaworker-2:8080
      KFW_API_TLS_CERT_PATH: /tls/server.crt
      KFW_API_TLS_KEY_PATH: /tls/server.key
      KFW_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
      KafkaWorker__Api__EnableSeedEndpoint: "true"
    depends_on: [etcd1, etcd2, etcd3]

  # Живой ValkeyWorker (t03; arch/04 §2.4): профиль valkey — только явно.
  # Управляет docker-хостом через сокет; контейнеры нод vwk-* поднимает на
  # хосте стенда (portalloc 17000–17999: на одном docker-хосте один valkey-контур).
  # API-порт на хост НЕ публикуется: панель и чеки ходят через панель/панельную
  # сеть (compose-DNS valkeyworker:8080); сид — 05-seed.sh (exec curl внутрь).
  valkeyworker:
    build:
      context: ../..
      dockerfile: docker/ValkeyWorker.Dockerfile
    image: valkeyworker:dev
    container_name: as-valkeyworker
    restart: unless-stopped
    profiles: ["valkey"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vw-snapshots:/snapshots
      # mTLS HTTP API (arch/21 §1.1): per-install пакет (deploy/tls/gen.sh) —
      # server-серт с SAN DNS:valkeyworker (t03), клиентский CA общий.
      - ../../deploy/tls:/tls:ro
    extra_hosts:
      - "local:host-gateway"
    environment:
      ValkeyWorker__Etcd__Endpoints__0: http://etcd1:2379
      ValkeyWorker__Etcd__Endpoints__1: http://etcd2:2379
      ValkeyWorker__Etcd__Endpoints__2: http://etcd3:2379
      ValkeyWorker__AdvertisedClientHost: host.docker.internal
      ValkeyWorker__Api__AdvertiseUrl: https://valkeyworker:8080
      VWK_API_TLS_CERT_PATH: /tls/server.crt
      VWK_API_TLS_KEY_PATH: /tls/server.key
      VWK_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
      ValkeyWorker__Api__EnableSeedEndpoint: "true"
    depends_on: [etcd1, etcd2, etcd3]

  # Второй инстанс ValkeyWorker (t07, arch/21 §2): симметрично kafkaworker-2 —
  # compose-DNS advertise, без хост-публикации; клэймы/portalloc разрулит etcd.
  valkeyworker-2:
    build:
      context: ../..
      dockerfile: docker/ValkeyWorker.Dockerfile
    image: valkeyworker:dev
    container_name: as-valkeyworker-2
    restart: unless-stopped
    profiles: ["valkey"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vw-snapshots:/snapshots
      - ../../deploy/tls:/tls:ro
    extra_hosts:
      - "local:host-gateway"
    environment:
      ValkeyWorker__Etcd__Endpoints__0: http://etcd1:2379
      ValkeyWorker__Etcd__Endpoints__1: http://etcd2:2379
      ValkeyWorker__Etcd__Endpoints__2: http://etcd3:2379
      ValkeyWorker__AdvertisedClientHost: host.docker.internal
      ValkeyWorker__Api__AdvertiseUrl: https://valkeyworker-2:8080
      VWK_API_TLS_CERT_PATH: /tls/server.crt
      VWK_API_TLS_KEY_PATH: /tls/server.key
      VWK_API_TLS_CLIENT_CA_PATH: /tls/ca.pem
      ValkeyWorker__Api__EnableSeedEndpoint: "true"
    depends_on: [etcd1, etcd2, etcd3]

  # Стек мониторинга (arch/18 §5; профиль metrics — входит в полный подъём
  # 00-up.sh, quick без него). Порты — env-override при коллизиях на хосте (M4).
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: as-prometheus
    profiles: ["metrics"]
    ports: ["${METRICS_PROMETHEUS_PORT:-9090}:9090"]
    networks:
      # default (сеть стенда) сохраняется явно: compose не подключает default
      # при указанном networks.
      default: {}
      # Внешняя сеть контура мониторинга (t15, arch/18 §5.4; владелец —
      # deploy-compose): таргеты pgworker/pgworker-2 (aliases) и
      # patroni-nodes (<alias>:8008 из portalloc). Мосты host-форвардинга
      # демонтажены — все таргеты прометея сетевые.
      pgw-metrics: {}
    volumes:
      - ./metrics/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./metrics/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # file_sd-таргет pgworker (сетевые адреса пишет 00-up.sh; файл
      # перезаписывается in place, prometheus перечитывает сам).
      - ./metrics/prometheus/pgworker-targets.json:/etc/prometheus/pgworker-targets.json:ro
      # file_sd-таргеты реальных Patroni-нод — пишет sd-generator (t15, arch/18 §5.4).
      - prometheus-sd:/etc/prometheus/sd:ro
      - prometheus-data:/prometheus
      # Скрейп воркеров за mTLS (t03, О4): TLS-пакет ro (tls_config prometheus.yml).
      - ../../deploy/tls:/tls:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]

  # file_sd-генератор реальных Patroni-нод (t15, arch/18 §5.4): тик читает
  # /pgworker/portalloc/ (read-only) и пишет таргеты в volume Prometheus.
  # Локально собираемый образ — в registry НЕ класть (канон AGENTS.md).
  # Publish выполняется НА ХОСТЕ (00-up.sh) в artifacts/sd-generator/publish.
  # Контекст — корень репо: BuildKit-песочница Docker Desktop не читает
  # dockerfile вне контекста, поэтому путь publish-вывода передаётся через
  # SD_PUBLISH_DIR (в образ попадает ТОЛЬКО publish-вывод — канон E2E-образов).
  sd-generator:
    build:
      context: ../..
      dockerfile: docker/Metrics.SdGenerator.Dockerfile
      args:
        SD_PUBLISH_DIR: artifacts/sd-generator/publish
    image: sdgenerator:dev
    container_name: as-sd-generator
    restart: unless-stopped
    profiles: ["metrics"]
    volumes:
      - prometheus-sd:/sd
    environment:
      SdGenerator__Etcd__Endpoints__0: http://etcd1:2379
      SdGenerator__Etcd__Endpoints__1: http://etcd2:2379
      SdGenerator__Etcd__Endpoints__2: http://etcd3:2379
      SdGenerator__OutputPath: /sd/patroni-nodes.json
    depends_on: [etcd1, etcd2, etcd3]

  grafana:
    image: grafana/grafana:13.0.8
    container_name: as-grafana
    profiles: ["metrics"]
    ports: ["${METRICS_GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin   # стенд: cookie-логин локального мониторинга
    volumes:
      - ./metrics/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./metrics/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Webhook-ресивер: URL — env METRICS_ALERT_WEBHOOK_URL (пусто — только UI
  # Prometheus/Alertmanager; спека §3.7 Д4). Выбор конфига — entrypoint.
  # alertmanager-data (ревью Ф7-6): nflog/silences переживают рестарт
  # (repeat_interval 4h — без тома рестарт сбрасывает историю отправок).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: as-alertmanager
    profiles: ["metrics"]
    ports: ["${METRICS_ALERTMANAGER_PORT:-9093}:9093"]
    volumes:
      - ./metrics/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      METRICS_ALERT_WEBHOOK_URL: ${METRICS_ALERT_WEBHOOK_URL:-}

# Внешняя сеть контура мониторинга (t15, arch/18 §5.4): владелец —
# deploy-compose (создаёт при up, сносит при down); стендовый Prometheus
# аттачит её для скрейпа pgworker/pgworker-2/patroni-nodes. 00-up.sh
# поднимает deploy-контур ДО стендового компоуза — сеть существует к
# external-attach; 90-down.sh разбирает в обратном порядке.
networks:
  pgw-metrics:
    name: ${METRICS_NETWORK:-pgw-metrics}
    external: true

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:
  as-minio-data:
  kfw-snapshots:
  vw-snapshots:
  prometheus-data:
  prometheus-sd:
  grafana-data:
  alertmanager-data:
