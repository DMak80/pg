global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  # Таргеты — сетевые адреса deploy-воркеров (aliases pgworker/pgworker-2 в
  # единой сети контура pgw-metrics, t15 arch/18 §5.2) — файл file_sd пишет
  # 00-up.sh; host-публикации API остаются для advertise/чеков/панели.
  - job_name: pgworker            # deploy-compose (mTLS, t03)
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
      cert_file: /tls/prometheus.crt
      key_file: /tls/prometheus.key
    file_sd_configs:
      - files: ["/etc/prometheus/pgworker-targets.json"]
  - job_name: kafkaworker         # сеть стенда (профиль kafka; mTLS — чинит t03-gap)
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
      cert_file: /tls/prometheus.crt
      key_file: /tls/prometheus.key
    static_configs: [{targets: ["kafkaworker:8080", "kafkaworker-2:8080"]}]
  - job_name: valkeyworker         # сеть стенда (профиль valkey; mTLS — общий tls_config, t05)
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
      cert_file: /tls/prometheus.crt
      key_file: /tls/prometheus.key
    static_configs: [{targets: ["valkeyworker:8080", "valkeyworker-2:8080"]}]
  - job_name: adminpanel          # сеть стенда
    static_configs: [{targets: ["adminpanel:8080"]}]
  - job_name: patroni             # эмуляторы :8008 (arch/18 §2.5) — TLS per-install CA
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
    static_configs: [{targets: ["hc1a:8008", "hc1b:8008", "hc2a:8008", "hc2b:8008"]}]
  - job_name: patroni-nodes       # реальные ноды PgWorker (t15, arch/18 §2.5/§5.4)
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
    file_sd_configs:
      - files: ["/etc/prometheus/sd/patroni-nodes.json"]
        refresh_interval: 30s
  - job_name: sd-generator        # самонаблюдение генератора (arch/18 §5.4)
    static_configs: [{targets: ["sd-generator:8080"]}]
