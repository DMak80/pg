global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  # Host-публикация pgworker параметризуется (PGW_API_HOST_PORT, коллизии
  # на хосте) — target держится в file_sd-файле (переписывает 00-up.sh).
  - job_name: pgworker            # deploy-compose (mTLS, t03)
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
      cert_file: /tls/prometheus.crt
      key_file: /tls/prometheus.key
    file_sd_configs:
      - files: ["/etc/prometheus/pgworker-targets.json"]
  - job_name: kafkaworker         # сеть стенда (профиль kafka; mTLS — чинит t03-gap)
    scheme: https
    tls_config:
      ca_file: /tls/ca.pem
      cert_file: /tls/prometheus.crt
      key_file: /tls/prometheus.key
    static_configs: [{targets: ["kafkaworker:8080"]}]
  - job_name: adminpanel          # сеть стенда
    static_configs: [{targets: ["adminpanel:8080"]}]
  - job_name: patroni             # эмуляторы :8008 (arch/18 §2.5)
    static_configs: [{targets: ["hc1a:8008", "hc1b:8008", "hc2a:8008", "hc2b:8008"]}]
