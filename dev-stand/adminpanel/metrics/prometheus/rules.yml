groups:
  - name: workers
    rules:
      - alert: ServiceDown
        expr: up{job=~"pgworker|kafkaworker|adminpanel"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "сервис {{ $labels.job }} недоступен ({{ $labels.instance }})"
          description: "scrape падает 2 мин; runbook — arch/18-metrics.md §5.2"
      - alert: WorkerLoopStalled
        expr: time() - worker_loop_last_success_timestamp_seconds{loop=~"reconcile|keepalive"} > 60
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "цикл {{ $labels.job }}/{{ $labels.loop }} не тикает >60с"
          description: "только быстрые циклы (reconcile/keepalive); живость снапшота закрывает SnapshotStale; циклы 5с, запас на ErrorDelay-бэкофф; runbook — arch/18 §2.2"
      - alert: SnapshotStale
        expr: worker_snapshot_age_seconds > 28800
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "снапшот P12 старше 8ч ({{ $labels.job }})"
          description: "снапшоты раз в 6ч; runbook — arch/18 §2.2"
      - alert: ProcessPhaseStuck
        expr: worker_process_phase_duration_seconds > 1800
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "кластер {{ $labels.cluster }} в фазе {{ $labels.process }}/{{ $labels.phase }} >30мин"
          description: "provision-фазы допускают до 1ч; runbook — arch/18 §2.2"
  - name: kafka
    rules:
      - alert: KafkaUnderReplicated
        expr: sum by (cluster) (kafka_under_replicated_partitions) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "кластер {{ $labels.cluster }}: недореплицированные партиции"
          description: "ISR ⊂ assignment 5мин; runbook — arch/18 §2.3"
      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_lag > 1000000
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "лаг {{ $labels.group }}@{{ $labels.topic }} > 1e6 ({{ $labels.cluster }})"
          description: "порог стартовый, тюнинг по истории; runbook — arch/18 §2.3"
      - alert: KafkaCollectorStalled
        expr: time() - kafka_collector_last_success_timestamp_seconds > 300
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "коллектор kafka-метрик не собирает >5мин"
          description: "фиксированный порог ≥3×CollectIntervalSec(30с); runbook — arch/18 §4"
  - name: valkey
    rules:
      - alert: ValkeyCollectorStalled
        expr: time() - valkey_collector_last_success_timestamp_seconds > 300
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "коллектор valkey-метрик не собирает >5мин"
          description: "фиксированный порог ≥3×CollectIntervalSec(30с); runbook — arch/18 §4.2"
      - alert: ValkeyEvictionsGrowing
        expr: rate(valkey_evicted_keys[5m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.node }}: выселения ключей растут"
          description: "rate по gauge-кумулятиву (сбросы при рестарте — arch/18 §2.6); runbook — arch/18 §2.6"
      - alert: ValkeyMemoryNearMax
        expr: (valkey_memory_used_bytes / valkey_memory_max_bytes > 0.9) and (valkey_memory_max_bytes > 0)
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.node }}: память >90% maxmemory"
          description: "and valkey_memory_max_bytes > 0 отсекает безлимитный maxmemory=0; runbook — arch/18 §2.6"
  - name: pg
    rules:
      - alert: PgReplicaLagHigh
        expr: pg_replica_lag_seconds > 30
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "реплика {{ $labels.node }} ({{ $labels.scope }}) отстаёт >30с"
          description: "scrape Patroni-эмуляторов; runbook — arch/18 §2.5"
      # t15 (arch/18 §2.5/§5.4): реальные Patroni-ноды — нативные patroni_*
      # (file_sd patroni-nodes) и самонаблюдение генератора.
      - alert: PatroniNodeDown
        expr: up{job="patroni-nodes"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Patroni-нода {{ $labels.instance }} ({{ $labels.cluster }}/{{ $labels.shard }}/{{ $labels.node }}) недоскрейпится 5мин"
          description: "нода в rebuild — штатный сценарий (~90с), порог терпит; runbook — arch/18 §2.5"
      - alert: PatroniReplicaLagHigh
        expr: time() - patroni_xlog_replayed_timestamp > 30
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "реплика {{ $labels.name }} ({{ $labels.scope }}) отстаёт >30с"
          description: "зеркало PgReplicaLagHigh на нативных сериях; серия есть только у реплик; runbook — arch/18 §2.5"
      - alert: SdGeneratorStalled
        expr: time() - sd_generator_last_success_timestamp_seconds > 300
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "file_sd-генератор не тикает >5мин"
          description: "фиксированный порог ≥3×RefreshIntervalSec(15с); runbook — arch/18 §5.4"
  # t14 (arch/18 §2.7): бэкап-домен — зеркало подмножества панельных правил
  # (независимый от панели канал; etcd-источник истины статусов остаётся).
  - name: backups
    rules:
      - alert: BackupFullStale
        expr: pgworker_backup_full_age_seconds > pgworker_backup_full_max_age_seconds
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "кластер {{ $labels.cluster }}/{{ $labels.shard }}: возраст валидного полного выше порога"
          description: "per-cluster порог из серии max_age (политики бэкапов, arch/19 §2); runbook — arch/18 §2.7"
      - alert: BackupFullMissing
        expr: pgworker_backup_full_max_age_seconds unless pgworker_backup_full_age_seconds
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "кластер {{ $labels.cluster }}/{{ $labels.shard }}: валидного полного нет вовсе"
          description: "max_age эмитится, age нет — семантика IsValid планировщика; runbook — arch/18 §2.7"
      - alert: BackupWalLagHigh
        expr: pgworker_backup_wal_lag_segments > 1024
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.shard }}: отставание WAL-потока >1024 сегментов"
          description: "порог = дефолт PgWorker:Backups:Wal:LagMaxSegments (per-install конфиг; per-cluster WAL-политики в etcd нет, arch/19 §4); runbook — arch/18 §2.7"
      - alert: BackupWalStale
        expr: pgworker_backup_wal_last_uploaded_age_seconds > 300
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.shard }}: тишина WAL-загрузок >300с"
          description: "порог = дефолт PgWorker:Backups:Wal:StaleSec (per-install конфиг); runbook — arch/18 §2.7"
      - alert: BackupVerifyFailed
        expr: increase(pgworker_backup_verify_total{result="failed"}[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.shard }}: проверка полного бэкапа провалена"
          description: "increase[15m] при scrape 15с; runbook — arch/18 §2.7, arch/19 §5"
      - alert: BackupRestoreFailed
        expr: increase(pgworker_backup_restore_total{result="failed"}[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.shard }}: восстановление из бэкапа провалено"
          description: "терминальный FAILED restore-заявки; runbook — arch/18 §2.7, arch/19 §3.5"
      - alert: BackupDrillFailed
        expr: increase(pgworker_backup_drill_total{result="failed"}[15m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.cluster }}/{{ $labels.shard }}: дрилл восстановимости провален"
          description: "восстановимость не доказана; runbook — arch/18 §2.7, arch/19 §3.6"
