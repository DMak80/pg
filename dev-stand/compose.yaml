# Dev-стенд PgWorker (задача 26; spec §9): внешний слой etcd. PgWorker в стенд
# НЕ входит — запускается хост-процессом (dotnet run --project src/PgWorker.App
# или integration/e2e-тесты) и управляет локальным docker через сокет.
#
#   docker compose -f dev-stand/compose.yaml up -d
#   ./dev-stand/seed.sh                      # сид кластера shop (панель 02 §9.1)
#   ./dev-stand/seed.sh http://localhost:2379 shop2   # ещё один кластер
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: pgw-stand-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

volumes:
  etcd-data:
