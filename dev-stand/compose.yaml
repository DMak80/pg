# Dev-стенд PgWorker (задача 26; spec §9): внешний слой etcd. PgWorker в стенд
# НЕ входит — поднимается из deploy/ (docker compose up -d pgworker) и
# управляет локальным docker через сокет.
#
#   docker compose -f dev-stand/compose.yaml up -d
#   ( cd deploy && docker compose up -d pgworker )     # воркер (docker-only)
#   ./dev-stand/seed.sh                        # декларация кластера shop через API воркера
#   ./dev-stand/seed.sh http://localhost:8080 shop2    # ещё один кластер
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: pgw-stand-etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      # Advertise — адрес, который возвращается в /v3/cluster/member/list:
      # его потребляют Patroni-ноды (контейнеры) для DCS; из контейнера
      # 127.0.0.1 недостижим — только host.docker.internal (как в e2e-фикстуре).
      - --advertise-client-urls=http://host.docker.internal:2379
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

volumes:
  etcd-data:
